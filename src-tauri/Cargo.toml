[package]
name = "passio"
version = "1.0.0"
description = "Passio - Kişisel Düşünce ve Okuma Odası"
authors = ["Passio Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
